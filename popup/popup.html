<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img class="logo-img" src="../icons/icon-48.png" alt="">
    <span id="title" class="title"></span>
    <span class="spacer"></span>
    <button class="icon" id="open-icloud" data-icon="mail" data-i18n-title="openICloudMail"></button>
    <button class="icon" id="refresh" data-icon="refresh" data-i18n-title="refresh"></button>
    <button class="icon" id="newtab" data-icon="openNew" data-i18n-title="openTab"></button>
    <button class="icon" id="menu-top" data-icon="more" data-i18n-title="menu"></button>
  </header>

  <div id="menu" class="menu" hidden>
    <button id="m-web" data-i18n="openICloudMail"></button>
    <button id="m-options" data-i18n="options"></button>
  </div>

  <main id="v-main" class="view">
    <div id="signin" class="card" hidden>
      <p data-i18n="signInHint"></p>
      <button class="primary" id="signinBtn" data-i18n="signIn"></button>
    </div>

    <div id="account" hidden>
      <div class="hero">
        <h1 id="hero-title"></h1>
        <div id="hero-sub"></div>
      </div>
      <div class="card account-header">
        <div class="avatar" id="acc-avatar"></div>
        <div class="acc-main">
          <div class="acc-email" id="acc-email"></div>
          <div class="acc-sub" id="acc-sub"></div>
        </div>
        <input id="q" class="search" type="search" data-i18n-ph="search" hidden>
        <button class="icon" id="acc-compose" data-icon="edit" data-i18n-title="compose"></button>
        <button class="icon" id="acc-search" data-icon="search" data-i18n-title="search"></button>
      </div>
      <nav id="tabs" class="tabs">
        <button data-folder="INBOX" class="on" data-i18n="inbox"></button>
        <button data-folder="Archive" data-i18n="archive"></button>
        <button data-folder="Sent Messages" data-i18n="sent"></button>
        <button data-folder="Deleted Messages" data-i18n="trash"></button>
      </nav>
      <div id="trashbar" class="trashbar" hidden>
        <button id="empty-trash" class="danger" data-i18n="emptyTrash"></button>
        <div id="trash-confirm" class="confirm" hidden>
          <span data-i18n="emptyConfirm"></span>
          <button id="trash-cancel" class="btn" data-i18n="cancel"></button>
          <button id="trash-go" class="danger solid" data-i18n="deleteForever"></button>
        </div>
        <div id="trash-status" class="addr"></div>
      </div>
      <div id="list"></div>
    </div>
  </main>

  <section id="v-detail" class="view" hidden>
    <div class="toolbar">
      <button class="icon" id="d-back" data-icon="back" data-i18n-title="back"></button>
      <button class="icon" id="d-prev" data-icon="up" data-i18n-title="prevMail"></button>
      <button class="icon" id="d-next" data-icon="down" data-i18n-title="nextMail"></button>
      <span class="spacer"></span>
      <button class="icon" id="act-read" data-icon="read"></button>
      <button class="icon" id="act-star" data-icon="starBorder" data-i18n-title="star"></button>
      <button class="icon" id="act-archive" data-icon="archive" data-i18n-title="archive"></button>
      <button class="icon" id="act-trash" data-icon="trash" data-i18n-title="trash"></button>
      <button class="icon" id="act-reply" data-icon="reply" data-i18n-title="reply"></button>
      <button class="icon" id="open-web" data-icon="openNew" data-i18n-title="openInICloud"></button>
    </div>
    <div class="open-head">
      <h2 id="d-subject"></h2>
      <div class="sender-line"><span id="d-sender"></span><span id="d-addr" class="addr"></span></div>
      <div id="d-date" class="addr"></div>
    </div>
    <div class="pad">
      <div id="d-code" class="code" hidden></div>
      <div id="d-thread"></div>
      <ul id="d-att"></ul>
      <div id="d-err" class="addr"></div>
    </div>
  </section>

  <section id="v-composer" class="view" hidden>
    <div class="comp-top">
      <button class="icon round" id="c-back" data-icon="close" data-i18n-title="back"></button>
      <span class="spacer"></span>
      <button class="icon" id="f-undo" data-icon="undo" data-i18n-title="undo"></button>
      <button class="icon" id="f-redo" data-icon="redo" data-i18n-title="redo"></button>
      <button class="icon" id="f-bold" data-icon="bold" data-i18n-title="bold"></button>
      <button class="icon" id="f-italic" data-icon="italic" data-i18n-title="italic"></button>
      <button class="icon" id="f-underline" data-icon="underline" data-i18n-title="underline"></button>
      <button class="icon" id="f-list" data-icon="list" data-i18n-title="list"></button>
      <button class="icon" id="f-link" data-icon="link" data-i18n-title="link"></button>
      <span class="spacer"></span>
      <button class="send-round" id="c-send" data-icon="send" data-size="20" data-i18n-title="send"></button>
    </div>
    <div id="c-linkrow" class="linkrow" hidden>
      <input id="c-link" placeholder="https://">
      <button class="primary" id="c-linkok" data-i18n="ok"></button>
    </div>
    <div class="comp-rows">
      <label class="crow"><span data-i18n="toLabel"></span><input id="c-to"></label>
      <div class="crow"><span data-i18n="fromLabel"></span><b id="c-from"></b></div>
      <label class="crow"><span data-i18n="subject"></span><input id="c-subject"></label>
    </div>
    <div class="comp-body">
      <div id="c-editor" class="editor" contenteditable="true" spellcheck="true"></div>
      <div id="c-quote-wrap" class="qwrap" hidden>
        <div id="c-attrib" class="attrib"></div>
        <div id="c-quote" class="quote"></div>
      </div>
      <div id="c-status" class="addr"></div>
    </div>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
