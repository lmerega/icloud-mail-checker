<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Icon mockups</title>
<style>
  body { font: 14px system-ui, sans-serif; background: #f3f3f3; color: #222; margin: 0; padding: 24px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .card { background: #fff; border-radius: 18px; padding: 16px; box-shadow: 0 1px 6px rgba(0,0,0,.12); }
  .card b { display: block; font-size: 16px; margin-bottom: 2px; }
  .card small { color: #666; display: block; margin-bottom: 12px; min-height: 32px; }
  .sizes { display: flex; align-items: flex-end; gap: 14px; }
  .sizes svg:nth-child(1) { width: 128px; height: 128px; }
  .sizes svg:nth-child(2) { width: 48px; height: 48px; }
  .sizes svg:nth-child(3) { width: 32px; height: 32px; }
  .sizes svg:nth-child(4) { width: 16px; height: 16px; }
  .dark { background: #202124; border-radius: 10px; padding: 8px; margin-top: 12px; display: flex; gap: 10px; align-items: center; color: #aaa; font-size: 12px; }
  .dark svg { width: 24px; height: 24px; }
</style>
</head>
<body>
<h1>Zoho Mail Checker — 10 proposte di icona</h1>
<div class="grid" id="grid"></div>

<script>
const ICONS = [
 ['1 · Arcobaleno', 'Quadrato a gradiente caldo-freddo con busta bianca.', `
  <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5f6d"/><stop offset=".5" stop-color="#ffc371"/><stop offset="1" stop-color="#47c9e5"/></linearGradient></defs>
  <rect width="128" height="128" rx="28" fill="url(#g1)"/>
  <rect x="24" y="38" width="80" height="54" rx="9" fill="#fff"/>
  <path d="M28 46 64 72 100 46" fill="none" stroke="#ff5f6d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`],
 ['2 · Busta con badge', 'Busta bianca, falda arancio-viola e pallino rosso dei non letti.', `
  <rect width="128" height="128" rx="28" fill="#f4f1ff"/>
  <defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a3c"/><stop offset="1" stop-color="#9b5cf6"/></linearGradient></defs>
  <rect x="18" y="36" width="84" height="58" rx="10" fill="#fff" stroke="#d9d2f5" stroke-width="3"/>
  <path d="M18 44a10 10 0 0 1 10-8h64a10 10 0 0 1 10 8L60 72Z" fill="url(#g2)"/>
  <circle cx="98" cy="34" r="18" fill="#ff3b30"/><text x="98" y="41" text-anchor="middle" font-family="Arial" font-weight="700" font-size="22" fill="#fff">3</text>`],
 ['3 · Quattro colori', 'Busta con falda divisa in rosso, giallo, verde e blu.', `
  <rect width="128" height="128" rx="28" fill="#fff"/>
  <rect x="16" y="34" width="96" height="62" rx="10" fill="#f1f3f4"/>
  <path d="M16 44a10 10 0 0 1 10-10h38L64 66Z" fill="#ea4335"/>
  <path d="M64 34h38a10 10 0 0 1 10 10L64 66Z" fill="#fbbc04"/>
  <path d="M16 96V44l48 28Z" fill="#34a853"/>
  <path d="M112 96V44L64 72Z" fill="#4285f4"/>
  <path d="M16 90a10 10 0 0 0 10 6h76a10 10 0 0 0 10-6L64 62Z" fill="#fff" opacity=".0"/>`],
 ['4 · Nuvola tramonto', 'Nuvola bianca su gradiente tramonto, busta colorata davanti.', `
  <defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a5cff"/><stop offset=".55" stop-color="#ff5fa2"/><stop offset="1" stop-color="#ffb347"/></linearGradient></defs>
  <rect width="128" height="128" rx="28" fill="url(#g4)"/>
  <path d="M38 88a18 18 0 0 1-2-35.9A26 26 0 0 1 86 48a20 20 0 0 1 6 40Z" fill="#fff"/>
  <rect x="44" y="56" width="40" height="28" rx="5" fill="#ff5fa2"/>
  <path d="M46 60 64 73 82 60" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`],
 ['5 · Verde lime + arancio', 'Gradiente verde-acqua con busta e pallino notifica arancio.', `
  <defs><linearGradient id="g5" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#00b8a9"/><stop offset="1" stop-color="#b8e83c"/></linearGradient></defs>
  <rect width="128" height="128" rx="28" fill="url(#g5)"/>
  <rect x="22" y="38" width="76" height="52" rx="9" fill="#fff"/>
  <path d="M26 46 60 70 94 46" fill="none" stroke="#00b8a9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="98" cy="36" r="14" fill="#ff7a1a" stroke="#fff" stroke-width="5"/>`],
 ['6 · Busta aperta', 'Lettera gialla che esce da una busta su fondo viola.', `
  <defs><linearGradient id="g6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7b2ff7"/><stop offset="1" stop-color="#f107a3"/></linearGradient></defs>
  <rect width="128" height="128" rx="28" fill="url(#g6)"/>
  <rect x="38" y="24" width="52" height="50" rx="5" fill="#ffe36e"/>
  <rect x="46" y="34" width="36" height="5" rx="2.5" fill="#f5b700"/><rect x="46" y="45" width="28" height="5" rx="2.5" fill="#f5b700"/>
  <path d="M20 58a8 8 0 0 1 8-8h72a8 8 0 0 1 8 8v38a10 10 0 0 1-10 10H30a10 10 0 0 1-10-10Z" fill="#fff"/>
  <path d="M22 60 64 88 106 60" fill="none" stroke="#f107a3" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`],
 ['7 · Controllo OK', 'Busta bianca con spunta verde (checker) su fondo azzurro-turchese.', `
  <defs><linearGradient id="g7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4ff"/><stop offset="1" stop-color="#3b6bff"/></linearGradient></defs>
  <rect width="128" height="128" rx="28" fill="url(#g7)"/>
  <rect x="18" y="34" width="84" height="58" rx="10" fill="#fff"/>
  <path d="M22 44 60 70 98 44" fill="none" stroke="#3b6bff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="96" cy="92" r="21" fill="#22c55e" stroke="#fff" stroke-width="6"/>
  <path d="M86 92l7 7 12-14" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`],
 ['8 · Tre buste', 'Tre buste a ventaglio: rosa, giallo e ciano.', `
  <rect width="128" height="128" rx="28" fill="#1f2340"/>
  <g transform="rotate(-14 64 70)"><rect x="26" y="40" width="64" height="44" rx="8" fill="#ff6fb1"/></g>
  <g transform="rotate(12 64 70)"><rect x="38" y="42" width="64" height="44" rx="8" fill="#5ee6ff"/></g>
  <rect x="32" y="46" width="64" height="46" rx="8" fill="#ffd54a"/>
  <path d="M36 54 64 74 92 54" fill="none" stroke="#1f2340" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`],
 ['9 · Cerchio nuvola', 'Cerchio a gradiente con nuvola bianca e busta multicolore.', `
  <defs><linearGradient id="g9" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff512f"/><stop offset="1" stop-color="#dd2476"/></linearGradient>
  <linearGradient id="g9b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36d1dc"/><stop offset="1" stop-color="#5b86e5"/></linearGradient></defs>
  <circle cx="64" cy="64" r="62" fill="url(#g9)"/>
  <path d="M34 88a16 16 0 0 1-1-31.9A24 24 0 0 1 79 52a18 18 0 0 1 5 36Z" fill="#fff"/>
  <rect x="50" y="58" width="44" height="30" rx="6" fill="url(#g9b)"/>
  <path d="M53 63 72 77 91 63" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`],
 ['10 · Aeroplano', 'Aeroplanino di carta su nuvola, gradiente verde-giallo-arancio.', `
  <defs><linearGradient id="g10" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#11998e"/><stop offset=".55" stop-color="#9be15d"/><stop offset="1" stop-color="#ffd84a"/></linearGradient></defs>
  <rect width="128" height="128" rx="28" fill="url(#g10)"/>
  <path d="M30 96a16 16 0 0 1 0-32 22 22 0 0 1 40-6 18 18 0 0 1 2 38Z" fill="#fff" opacity=".92"/>
  <path d="M30 70 100 34 82 98 64 80 52 90 50 72Z" fill="#ff6a3d"/>
  <path d="M50 72 100 34 64 80Z" fill="#ffb199"/>`]
];
const grid = document.getElementById('grid');
for (const [name, desc, body] of ICONS) {
  const svg = `<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<b>${name}</b><small>${desc}</small><div class="sizes">${svg}${svg}${svg}${svg}</div><div class="dark">${svg}<span>su tema scuro</span></div>`;
  grid.append(c);
}
</script>
</body>
</html>
