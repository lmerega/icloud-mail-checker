<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zoho Mail Checker</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="top">
    <img class="logo-img" src="../icons/icon-48.png" alt="">
    <span id="h" class="title"></span>
  </header>

  <main>
    <section class="card" id="acct">
      <h2 data-i18n="sectionAccount"></h2>
      <p id="acctState" class="hint"></p>
      <div id="setup">
        <p class="hint" data-i18n="setupHint"></p>
        <details class="guide" open>
          <summary data-i18n="guideTitle"></summary>
          <ol id="guide"></ol>
          <a id="consoleBtn" class="btn primary" target="_blank" rel="noopener" data-i18n="openConsole"></a>
        </details>
        <details class="guide">
          <summary data-i18n="troubleTitle"></summary>
          <ul class="trouble">
            <li data-i18n="trouble1"></li>
            <li data-i18n="trouble2"></li>
            <li data-i18n="trouble3"></li>
            <li data-i18n="trouble4"></li>
          </ul>
        </details>
        <label class="field"><span data-i18n="redirectLabel"></span>
          <span class="inline"><input id="redirect" readonly><button id="copyRedirect" class="btn" data-i18n="copy"></button></span>
        </label>
        <label class="field"><span data-i18n="regionLabel"></span><select id="region"></select></label>
        <label class="field"><span>Client ID</span><input id="clientId" autocomplete="off" spellcheck="false"></label>
        <label class="field"><span>Client Secret</span><input id="clientSecret" type="password" autocomplete="off" spellcheck="false"></label>
        <p class="hint" data-i18n="secretNote"></p>
      </div>
      <div class="btns">
        <button id="connect" class="btn primary" data-i18n="connect"></button>
        <button id="disconnect" class="btn" data-i18n="disconnect" hidden></button>
      </div>
      <p id="acctMsg" class="hint"></p>
    </section>

    <section class="card">
      <h2 data-i18n="sectionLook"></h2>
      <div class="row">
        <label for="lang" data-i18n="langLabel"></label>
        <select id="lang">
          <option value="auto" data-i18n="langAuto"></option>
          <option value="en">English</option>
          <option value="it">Italiano</option>
        </select>
      </div>
      <div class="row">
        <label for="theme" data-i18n="themeLabel"></label>
        <select id="theme">
          <option value="auto" data-i18n="themeAuto"></option>
          <option value="light" data-i18n="themeLight"></option>
          <option value="dark" data-i18n="themeDark"></option>
        </select>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="sectionCheck"></h2>
      <div class="row">
        <label for="poll" data-i18n="pollEvery"></label>
        <select id="poll"></select>
      </div>
      <p class="hint" data-i18n="pollNote"></p>
      <div class="row">
        <label for="notif" data-i18n="notifications"></label>
        <label class="switch"><input id="notif" type="checkbox"><span></span></label>
      </div>
      <div class="row">
        <label for="sound" data-i18n="soundLabel"></label>
        <label class="switch"><input id="sound" type="checkbox"><span></span></label>
      </div>
      <div id="sounds" class="sounds"></div>
      <p id="soundMsg" class="hint"></p>
      <div class="row">
        <label for="badge" data-i18n="badge"></label>
        <label class="switch"><input id="badge" type="checkbox"><span></span></label>
      </div>
      <p id="msg" class="saved"></p>
    </section>

    <section class="card">
      <h2 data-i18n="sectionBackup"></h2>
      <p class="hint" data-i18n="backupNote"></p>
      <div class="btns">
        <button id="export" class="btn" data-i18n="export"></button>
        <button id="import" class="btn" data-i18n="import"></button>
        <input id="file" type="file" accept="application/json" hidden>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="sectionConn"></h2>
      <p class="hint" data-i18n="connHint"></p>
      <button id="diag" class="btn primary" data-i18n="runCheck"></button>
      <ul id="diagOut" class="checks"></ul>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
