<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iCloud Mail Checker</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="top">
    <img class="logo-img" src="../icons/icon-48.png" alt="">
    <span id="h" class="title"></span>
  </header>

  <main>
    <section class="card">
      <h2 data-i18n="sectionLook"></h2>
      <div class="row">
        <label for="theme" data-i18n="themeLabel"></label>
        <select id="theme">
          <option value="auto" data-i18n="themeAuto"></option>
          <option value="light" data-i18n="themeLight"></option>
          <option value="dark" data-i18n="themeDark"></option>
        </select>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="sectionCheck"></h2>
      <div class="row">
        <label for="poll" data-i18n="pollEvery"></label>
        <select id="poll"></select>
      </div>
      <p class="hint" data-i18n="pollNote"></p>
      <div class="row">
        <label for="notif" data-i18n="notifications"></label>
        <label class="switch"><input id="notif" type="checkbox"><span></span></label>
      </div>
      <div class="row">
        <label for="sound" data-i18n="soundLabel"></label>
        <label class="switch"><input id="sound" type="checkbox"><span></span></label>
      </div>
      <div class="row">
        <label for="badge" data-i18n="badge"></label>
        <label class="switch"><input id="badge" type="checkbox"><span></span></label>
      </div>
      <div class="row">
        <span class="hint" id="soundMsg"></span>
        <button id="testSound" class="btn" data-i18n="testSound"></button>
      </div>
      <p id="msg" class="saved"></p>
    </section>

    <section class="card">
      <h2 data-i18n="sectionBackup"></h2>
      <p class="hint" data-i18n="backupNote"></p>
      <div class="btns">
        <button id="export" class="btn" data-i18n="export"></button>
        <button id="import" class="btn" data-i18n="import"></button>
        <input id="file" type="file" accept="application/json" hidden>
      </div>
    </section>

    <section class="card">
      <h2 data-i18n="sectionConn"></h2>
      <p class="hint" data-i18n="connHint"></p>
      <button id="diag" class="btn primary" data-i18n="runCheck"></button>
      <ul id="diagOut" class="checks"></ul>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
